<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All-in-One Launcher</title>
    <!-- กำหนด Tailwind Config ก่อนโหลดสคริปต์ -->
    <script>
        tailwind = {
            config: {
                darkMode: 'class'
            }
        };
    </script>
    <!-- โหลด Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- โหลด Google Fonts: Plus Jakarta Sans, IBM Plex Sans Thai, JetBrains Mono และ Noto Sans JP -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-outer: transparent;
            --bg-window: #fbfbfb;
            --bg-surface: rgba(255, 255, 255, 0.42);
            --bg-modal: #ffffff;
            --bg-card: rgba(255, 255, 255, 0.68);
            --bg-subbar: rgba(248, 250, 252, 0.38);
            --bg-input: rgba(248, 250, 252, 0.72);
            --bg-hover: rgba(241, 245, 249, 0.78);
            --border-color: rgba(226, 232, 240, 0.75);
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --accent-bg: #0f172a;
            --accent-text: #ffffff;
            --accent-hover: #1e293b;
        }

        html.dark, :root.dark, body.dark {
            --bg-outer: transparent;
            --bg-window: #1e1e1e;
            --bg-surface: rgba(30, 30, 34, 0.75);
            --bg-modal: #252528;
            --bg-card: rgba(45, 45, 48, 0.90);
            --bg-subbar: rgba(28, 28, 32, 0.65);
            --bg-input: rgba(38, 38, 42, 0.75);
            --bg-hover: rgba(55, 55, 60, 0.85);
            --border-color: rgba(255, 255, 255, 0.12);
            --text-primary: #fafafa;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --accent-bg: #fafafa;
            --accent-text: #09090b;
            --accent-hover: #e4e4e7;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', 'IBM Plex Sans Thai', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-window) !important;
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            -webkit-user-select: none;
            user-select: none;
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            box-sizing: border-box;
            transition: color 0.3s ease;
        }

        /* อนุญาตให้เลือกและพิมพ์ข้อความได้เฉพาะในช่องค้นหาเท่านั้น */
        input, textarea {
            -webkit-user-select: text;
            -moz-user-select: text;
            -ms-user-select: text;
            user-select: text;
        }

        #appWindow {
            background-color: var(--bg-window);
            border-color: var(--border-color);
            transition: all 0.36s cubic-bezier(0.22, 1, 0.36, 1);
        }

        /* พื้นผิวกระจกฝ้าโปร่งแสง */
        .theme-surface {
            background-color: var(--bg-surface);
            border-color: var(--border-color);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        /* ส่วนหัวและแถบนำทางโปร่งใส เพื่อให้ตัวอักษร Matrix Rain ไหลจากในกรอบด้านบนสุดลงมาได้อย่างชัดเจนต่อเนื่อง */
        header.app-header,
        header.app-header nav {
            background-color: transparent !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
        }

        .theme-modal {
            background-color: var(--bg-modal);
            border-color: var(--border-color);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .theme-card {
            background-color: var(--bg-card);
            border-color: var(--border-color);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .theme-subbar {
            background-color: var(--bg-subbar);
            border-color: var(--border-color);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .theme-input {
            background-color: var(--bg-input);
            border-color: var(--border-color);
            color: var(--text-primary);
            transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
        }

        .theme-text-primary { color: var(--text-primary); }
        .theme-text-secondary { color: var(--text-secondary); }
        .theme-text-muted { color: var(--text-muted); }
        .theme-border { border-color: var(--border-color); }

        .theme-hover:hover {
            background-color: var(--bg-hover);
        }

        .theme-btn-accent {
            background-color: var(--accent-bg);
            color: var(--accent-text);
            transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .theme-btn-accent:hover:not(:disabled) {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        .theme-btn-accent:active:not(:disabled) {
            transform: scale(0.96);
        }

        /* ซ่อน Scrollbar แนวนอนของแถบหมวดหมู่ */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Scrollbar คลีนๆ ภายในหน้าต่างแอป */
        .app-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .app-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .app-scroll::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.35);
            border-radius: 9999px;
        }
        html.dark .app-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.14);
        }
        .app-scroll::-webkit-scrollbar-thumb:hover {
            background: rgba(148, 163, 184, 0.55);
        }
        html.dark .app-scroll::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.26);
        }

        /* อนิเมชั่นการ์ดค่อยๆ ลอยขึ้นเมื่อแสดงผลหรือเปลี่ยนหมวดหมู่ */
        @keyframes cardFadeUp {
            0% {
                opacity: 0;
                transform: translateY(12px) scale(0.985);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .animate-card {
            animation: cardFadeUp 0.38s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            opacity: 0;
        }

        /* อนิเมชั่นเลื่อนของแถบเส้นใต้หมวดหมู่หลัก */
        .tab-indicator {
            background-color: var(--text-primary);
            transform-origin: left center;
            transition: left 0.35s cubic-bezier(0.22, 1, 0.36, 1),
                        width 0.35s cubic-bezier(0.22, 1, 0.36, 1),
                        transform 0.42s cubic-bezier(0.22, 1, 0.36, 1),
                        background-color 0.3s ease;
        }

        /* เอฟเฟกต์ Hover การ์ด */
        .card-hover {
            transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1),
                        box-shadow 0.25s cubic-bezier(0.22, 1, 0.36, 1),
                        border-color 0.25s ease,
                        background-color 0.3s ease;
        }
        .card-hover:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 24px -8px rgba(15, 23, 42, 0.08);
        }
        html.dark .card-hover:hover {
            box-shadow: 0 14px 28px -8px rgba(0, 0, 0, 0.75);
            border-color: rgba(255, 255, 255, 0.18);
        }

        /* อนิเมชั่นย่อและปิดหน้าต่างแอป */
        .window-minimized {
            opacity: 0 !important;
            transform: translateY(45vh) scale(0.15) !important;
            pointer-events: none !important;
        }
        .window-closed {
            opacity: 0 !important;
            transform: scale(0.92) !important;
            pointer-events: none !important;
        }

        /* อนิเมชั่น Log Overlay & Modal */
        .log-backdrop-hidden {
            display: none !important;
            opacity: 0;
            pointer-events: none;
        }
        .log-backdrop-visible {
            opacity: 1;
            pointer-events: auto;
        }
        .log-modal-hidden {
            opacity: 0;
            transform: translateY(18px) scale(0.96);
        }
        .log-modal-visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        @keyframes logLineEnter {
            0% {
                opacity: 0;
                transform: translateX(-8px);
            }
            100% {
                opacity: 1;
                transform: translateX(0);
            }
        }
        .animate-log-line {
            animation: logLineEnter 0.25s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        /* อนิเมชั่น View Transitions สลับธีมเฉพาะในกรอบหน้าต่างแอปพลิเคชัน #appWindow */
        :root {
            view-transition-name: none;
        }

        #appWindow {
            view-transition-name: app-window;
        }

        ::view-transition,
        ::view-transition-group(app-window),
        ::view-transition-image-pair(app-window),
        ::view-transition-old(app-window),
        ::view-transition-new(app-window) {
            pointer-events: none !important;
        }

        ::view-transition-group(app-window) {
            border-radius: 0;
            overflow: hidden;
        }

        ::view-transition-old(app-window),
        ::view-transition-new(app-window) {
            animation: none;
            mix-blend-mode: normal;
            border-radius: 0;
        }

        ::view-transition-old(app-window) {
            z-index: 1;
        }

        ::view-transition-new(app-window) {
            z-index: 9999;
        }

        /* พื้นหลัง Matrix Rain ครอบคลุมทั้งกรอบหน้าต่างแอปตั้งแต่ส่วนหัวด้านบนสุด */
        #matrixCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            pointer-events: none;
            z-index: 0;
        }
    
        /* สไตล์การ์ดโปรแกรม สอดคล้องตามรูปที่ 1 อย่างสมบูรณ์แบบ ทั้ง Dark และ Light */
        .app-card-item {
            background-color: rgba(255, 255, 255, 0.88);
            border-color: rgba(226, 232, 240, 0.95);
            transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
        }
        .app-card-item .card-title {
            color: #0f172a;
        }
        .app-card-item .card-desc {
            color: #64748b;
        }
        .app-card-item .card-icon-box {
            background-color: #ffffff;
            border-color: rgba(226, 232, 240, 0.9);
        }
        .app-card-item .card-checkbox {
            border-color: #94a3b8;
        }
        .app-card-item .card-ext-btn {
            color: #94a3b8;
        }
        .app-card-item .card-ext-btn:hover {
            color: #0f172a;
            background-color: rgba(0, 0, 0, 0.05);
        }

        html.dark .app-card-item {
            background-color: #2b2d31 !important;
            border-color: #383a40 !important;
        }
        html.dark .app-card-item .card-title {
            color: #ffffff !important;
        }
        html.dark .app-card-item .card-desc {
            color: #949ba4 !important;
        }
        html.dark .app-card-item .card-icon-box {
            background-color: #1e1f22 !important;
            border-color: #383a40 !important;
        }
        html.dark .app-card-item .card-checkbox {
            border-color: #585b64 !important;
        }
        html.dark .app-card-item .card-ext-btn {
            color: #80848e !important;
        }
        html.dark .app-card-item .card-ext-btn:hover {
            color: #ffffff !important;
            background-color: rgba(255, 255, 255, 0.08) !important;
        }
        html.dark .app-card-item.is-selected {
            border-color: #3b82f6 !important;
            background-color: rgba(30, 58, 138, 0.28) !important;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.6) !important;
        }

    </style>
</head>
<body class="w-screen h-screen overflow-hidden p-0 m-0 select-none">

    <!-- หน้าต่างแอปพลิเคชันหลัก (Desktop App Window Frame แนวนอน) -->
    <div id="appWindow" class="w-full h-full border-0 flex flex-col overflow-hidden relative">

        <!-- Canvas ตัวอักษรไหลครอบคลุมทั้งหน้าต่างแอปตั้งแต่ขอบบนสุดจนถึงด้านล่างสุด -->
        <canvas id="matrixCanvas"></canvas>

        <!-- Title Bar ของหน้าต่างแอป + ช่องค้นหา + เปลี่ยนภาษา + สลับธีม + ปุ่ม ย่อ ขยาย ปิด -->
        <header class="app-header border-b theme-border z-20 shrink-0 relative bg-transparent">
            <div id="appTitleBar" class="px-4 sm:px-6 h-14 flex items-center justify-between gap-3 select-none">
                <!-- โลโก้ SVG และชื่อแอป -->
                <div class="flex items-center gap-3 min-w-0">
                    <div class="w-8 h-8 rounded-xl theme-btn-accent flex items-center justify-center shadow-sm shrink-0">
                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="4 17 10 11 4 5"></polyline>
                            <line x1="12" y1="19" x2="20" y2="19"></line>
                        </svg>
                    </div>
                    <h1 id="appTitle" class="text-[15px] font-semibold tracking-tight theme-text-primary truncate">All-in-One Launcher</h1>
                </div>

                <!-- ช่องค้นหา + ปุ่มเปลี่ยนภาษา + ปุ่มเปลี่ยนธีม + ปุ่มควบคุมหน้าต่าง -->
                <div class="flex items-center gap-2 sm:gap-2.5">
                    <!-- ช่องค้นหาด่วน + กล่องเดาคำค้นหาอัตโนมัติ (Autocomplete) -->
                    <div id="searchContainer" class="relative w-44 sm:w-64 transition-all duration-200 focus-within:w-52 sm:focus-within:w-72">
                        <svg class="w-3.5 h-3.5 theme-text-muted absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <input
                            id="searchInput"
                            type="text"
                            autocomplete="off"
                            placeholder="ค้นหาโปรแกรม..."
                            class="w-full pl-8 pr-7 py-1.5 text-xs theme-input border rounded-xl focus:outline-none focus:ring-2 focus:ring-slate-400/20 transition-all"
                        >
                        <!-- ปุ่มล้างคำค้นหา -->
                        <button
                            id="clearSearchBtn"
                            type="button"
                            onclick="clearSearch()"
                            class="hidden absolute right-2 top-1/2 -translate-y-1/2 w-4 h-4 rounded-full flex items-center justify-center theme-text-muted theme-hover transition-colors"
                        >
                            <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                <line x1="6" y1="6" x2="18" y2="18"></line>
                            </svg>
                        </button>

                        <!-- กล่องเดาตัวอย่างคำค้นหา (Search Suggestions Dropdown) -->
                        <div
                            id="searchSuggestionsDropdown"
                            class="hidden opacity-0 -translate-y-1.5 scale-[0.98] pointer-events-none absolute left-0 right-0 top-full mt-2 theme-modal border rounded-2xl shadow-xl py-1.5 z-50 transition-all duration-200 origin-top overflow-hidden"
                        >
                            <div class="px-3 py-1 flex items-center justify-between border-b theme-border">
                                <span id="suggestionHeaderLabel" class="text-[10px] font-medium theme-text-muted tracking-wide">คำแนะนำการค้นหา</span>
                                <span class="text-[10px] theme-text-muted">Enter</span>
                            </div>
                            <div id="searchSuggestionsList" class="max-h-56 overflow-y-auto app-scroll py-1">
                                <!-- รายการคำแนะนำจะถูกสร้างผ่าน JS -->
                            </div>
                        </div>
                    </div>

                    <!-- ดรอปดาวน์เปลี่ยนภาษา (Language Dropdown) -->
                    <div class="relative" id="langDropdownWrapper">
                        <button
                            id="langDropdownBtn"
                            onclick="toggleLangDropdown(event)"
                            title="เปลี่ยนภาษา / Language"
                            class="h-8 px-2.5 rounded-xl border theme-input theme-hover flex items-center gap-1.5 text-xs font-medium theme-text-primary transition-all active:scale-95"
                        >
                            <svg class="w-3.5 h-3.5 theme-text-secondary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"></circle>
                                <line x1="2" y1="12" x2="22" y2="12"></line>
                                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                            </svg>
                            <span id="currentLangLabel">TH</span>
                            <svg id="langChevron" class="w-3 h-3 theme-text-muted transition-transform duration-200" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </button>

                        <!-- เมนูตัวเลือกภาษา -->
                        <div
                            id="langDropdownMenu"
                            class="hidden opacity-0 scale-95 pointer-events-none absolute right-0 mt-1.5 w-36 rounded-xl theme-modal border shadow-lg py-1 z-50 transition-all duration-150 origin-top-right"
                        >
                            <button
                                onclick="setLanguage('th')"
                                id="langOptTh"
                                class="w-full px-3 py-2 text-left text-xs flex items-center justify-between theme-hover transition-colors theme-text-primary font-medium"
                            >
                                <span>ไทย (TH)</span>
                                <svg id="checkTh" class="w-3.5 h-3.5 theme-text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="20 6 9 17 4 12"></polyline>
                                </svg>
                            </button>
                            <button
                                onclick="setLanguage('en')"
                                id="langOptEn"
                                class="w-full px-3 py-2 text-left text-xs flex items-center justify-between theme-hover transition-colors theme-text-secondary"
                            >
                                <span>English (EN)</span>
                                <svg id="checkEn" class="w-3.5 h-3.5 theme-text-primary hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="20 6 9 17 4 12"></polyline>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- ปุ่มสลับธีมมืด / สว่าง -->
                    <button
                        id="themeToggleBtn"
                        onclick="toggleTheme(event)"
                        title="สลับธีมมืด / สว่าง"
                        class="w-8 h-8 rounded-xl border theme-input theme-hover flex items-center justify-center theme-text-secondary transition-all active:scale-95"
                    >
                        <!-- ไอคอนพระจันทร์ (แสดงตอนธีมสว่าง) -->
                        <svg id="moonIcon" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                        <!-- ไอคอนพระอาทิตย์ (แสดงตอนธีมมืด) -->
                        <svg id="sunIcon" class="w-3.5 h-3.5 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="5"></circle>
                            <line x1="12" y1="1" x2="12" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="23"></line>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                            <line x1="1" y1="12" x2="3" y2="12"></line>
                            <line x1="21" y1="12" x2="23" y2="12"></line>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                        </svg>
                    </button>

                    <!-- เส้นคั่นบางๆ -->
                    <div class="h-4 w-[1px] theme-border border-r mx-0.5 hidden sm:block"></div>

                    <!-- ปุ่มควบคุมหน้าต่าง: ย่อ / ขยาย / ปิด (SVG ล้วน) -->
                    <div class="flex items-center gap-1">
                        <!-- ปุ่มย่อ (Minimize) -->
                        <button
                            id="minimizeBtn"

        // ตัวช่วยดึงข้อความตามภาษาที่เลือก
        function getLocalizedText(field) {
            if (!field) return '';
            if (typeof field === 'string') return field;
            return field[currentLang] || field.th || field.en || '';
        }

        let isThemeTransitioning = false;

        // ค้นหาองค์ประกอบที่สามารถคลิกได้ ณ พิกัด (x, y) ภายในกรอบแอป เพื่อให้คลิกได้ทันทีแม้อยู่ระหว่างอนิเมชั่น
        function findClickableTarget(x, y) {
            const appWin = document.getElementById('appWindow');
            if (!appWin) return null;
            const candidates = appWin.querySelectorAll('button, input, select, textarea, a, [role="button"], .theme-hover');
            for (let i = candidates.length - 1; i >= 0; i--) {
                const el = candidates[i];
                if (el.disabled || el.offsetParent === null) continue;
                const rect = el.getBoundingClientRect();
                if (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) {
                    return el;
                }
            }
            return null;
        }

        // ตัวดักจับคลิกขณะเปลี่ยนธีม เพื่อส่งต่อการกดไปยังปุ่ม/ช่องค้นหา/แท็บทันที ไม่ถูกบล็อก
        window.addEventListener('click', (e) => {
            if (!isThemeTransitioning) return;
            if (e.target === document.documentElement || e.target === document.body) {
                const target = findClickableTarget(e.clientX, e.clientY);
                if (target) {
                    e.stopPropagation();
                    e.preventDefault();
                    if (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA') {
                        target.focus();
                    } else {
                        target.click();
                    }
                }
            }
        }, true);

        // ฟังก์ชันสร้างรูปทรงโพลีกอนคลื่นมนๆ ที่มีมูฟเม้นกระเพื่อมไหลอย่างนุ่มนวล
        function generateWavyPolygon(cx, cy, radius, phase, amplitudeRatio, numPoints = 84) {
            const points = [];
            for (let i = 0; i < numPoints; i++) {
                const angle = (i / numPoints) * Math.PI * 2;
                const wave = amplitudeRatio > 0.001
                    ? (Math.sin(angle * 3 + phase) * 0.72 + Math.sin(angle * 5 - phase * 1.3) * 0.28)
                    : 0;
                const r = Math.max(0, radius * (1 + wave * amplitudeRatio));
                const px = Math.round((cx + Math.cos(angle) * r) * 10) / 10;
                const py = Math.round((cy + Math.sin(angle) * r) * 10) / 10;
                points.push(`${px}px ${py}px`);
            }
            return `polygon(${points.join(', ')})`;
        }

        // ฟังก์ชันสลับธีมมืด / สว่าง พร้อมอนิเมชั่นคลื่นมนๆ จบแบบคลีนๆ ไม่ดุ๊กดิ๊ก และคลิกสิ่งอื่นได้ตลอดเวลา
        function toggleTheme(event) {
            const btn = document.getElementById('themeToggleBtn');
            const appWin = document.getElementById('appWindow');
            const appRect = appWin ? appWin.getBoundingClientRect() : { left: 0, top: 0, width: window.innerWidth, height: window.innerHeight };
            const btnRect = btn ? btn.getBoundingClientRect() : null;

            // พิกัดศูนย์กลางคลื่น สัมพัทธ์กับกรอบ #appWindow
            const cx = btnRect ? (btnRect.left + btnRect.width / 2) - appRect.left : appRect.width - 140;
            const cy = btnRect ? (btnRect.top + btnRect.height / 2) - appRect.top : 28;

            const applyThemeDOM = () => {
                isDarkMode = !isDarkMode;
                const html = document.documentElement;
                const moonIcon = document.getElementById('moonIcon');
                const sunIcon = document.getElementById('sunIcon');

                if (isDarkMode) {
                    html.classList.add('dark');
                    moonIcon.classList.add('hidden');
                    sunIcon.classList.remove('hidden');
                    matrixConfig.theme = 'dark';
                } else {
                    html.classList.remove('dark');
                    moonIcon.classList.remove('hidden');
                    sunIcon.classList.add('hidden');
                    matrixConfig.theme = 'light';
                }
            };

            if (!document.startViewTransition) {
                applyThemeDOM();
                return;
            }

            // คำนวณระยะทางสูงสุดไปยังมุมทั้งสี่ของกรอบหน้าต่างแอป ให้เลยขอบออกไปอย่างเหลือเฟือ (1.5x)
            const maxCornerDist = Math.hypot(
                Math.max(cx, appRect.width - cx),
                Math.max(cy, appRect.height - cy)
            );
            const maxR = maxCornerDist * 1.5;

            // สร้างเฟรมอนิเมชั่นคลื่นมนๆ โดยให้คลื่นหมุนเฉพาะช่วงแรก และคลายตัวเรียบสนิทก่อนจบ เพื่อให้จบคลีนไม่มีดุ๊กดิ๊ก
            const steps = 28;
            const keyframes = [];
            for (let s = 0; s <= steps; s++) {
                const progress = s / steps;
                const r = progress * maxR;

                // การหมุนกระเพื่อมจะหยุดนิ่งสนิทตั้งแต่ 60% ของทาง ไม่หมุนวนตอนท้าย
                const phaseProgress = Math.min(1, progress / 0.60);
                const phase = Math.sin(phaseProgress * (Math.PI / 2)) * Math.PI * 2.8;

                // คลื่นลอนมนจะค่อยๆ คลายตัวเรียบสนิทเป็นวงโค้งมนบริสุทธิ์ก่อนเลยกรอบแอป
                let amp = 0;
                if (progress < 0.52) {
                    amp = 0.25;
                } else if (progress <= 0.80) {
                    const taper = (progress - 0.52) / 0.28;
                    amp = 0.25 * (1 - taper * taper);
                } else {
                    amp = 0; // เรียบเนียน 100% ครอบคลุมกรอบทั้งหมด ไร้รอยกระตุกหรือดุ๊กดิ๊ก
                }

                keyframes.push({
                    clipPath: generateWavyPolygon(cx, cy, r, phase, amp, 84)
                });
            }

            isThemeTransitioning = true;
            const transition = document.startViewTransition(() => {
                applyThemeDOM();
            });

            transition.finished.finally(() => {
                isThemeTransitioning = false;
            });

            transition.ready.then(() => {
                const anim = document.documentElement.animate(
                    keyframes,
                    {
                        duration: 1250, // ช้าลงพอดีๆ เห็นมูฟเม้นต์คลื่นชัดเจน และจบคลีน
                        easing: 'cubic-bezier(0.16, 1, 0.3, 1)',
                        pseudoElement: '::view-transition-new(app-window)'
                    }
                );
                anim.onfinish = () => {
                    isThemeTransitioning = false;
                };
            });
        }

        // แยกหมวดหมู่และรายการจากไฟล์ PowerShell
        function parsePowerShellCategories(psText) {
            const lines = psText.split(/\r?\n/);
            const extracted = [];
            let currentCat = null;

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                const regionMatch = line.match(/^#(?:region|===|---)\s*([A-Za-z0-9ก-๙\s&_-]+)/i);
                if (regionMatch && regionMatch[1].trim().length > 2) {
                    const title = regionMatch[1].replace(/[-=]/g, '').trim();
                    if (!title.toLowerCase().includes('end')) {
                        currentCat = {
                            id: 'gh-' + extracted.length,
                            name: { th: title, en: title },
                            icon: extracted.length % 2 === 0 ? 'apps' : 'system',
                            subCategories: [{ id: 'general', name: { th: 'ทั่วไป', en: 'General' }, items: [] }]
                        };
                        extracted.push(currentCat);
                    }
                }
                const wingetMatch = line.match(/winget\s+install[^\r\n"']*/i);
                if (wingetMatch && currentCat) {
                    const cmd = wingetMatch[0].trim();
                    const idMatch = cmd.match(/--id\s+([^\s]+)/i);
                    const appName = idMatch ? idMatch[1].split('.').pop() : 'Utility Tool';
                    currentCat.subCategories[0].items.push({
                        name: appName,
                        desc: { th: 'ติดตั้งผ่านตัวจัดการแพ็กเกจอัตโนมัติ', en: 'Automated package manager installation' },
                        cmd: cmd
                    });
                }
            }

            const validCats = extracted.filter(c => c.subCategories[0].items.length > 0);
            return validCats.length >= 2 ? validCats : null;
        }

        // ดึงรายการไอเท็มที่กำลังแสดงอยู่ตามหมวดหมู่และการค้นหา
        function getCurrentlyDisplayedItems() {
            const currentMain = catalogData.find(c => c.id === activeMainId);
            if (!currentMain) return [];

            let items = [];
            if (activeSubId === 'all') {
                currentMain.subCategories.forEach(sub => {
                    const subLabel = getLocalizedText(sub.name);
                    sub.items.forEach(item => {
                        items.push({ ...item, subName: subLabel });
                    });
                });
            } else {
                const currentSub = currentMain.subCategories.find(s => s.id === activeSubId);
                const subLabel = currentSub ? getLocalizedText(currentSub.name) : '';
                if (currentSub) {
                    items = currentSub.items.map(item => ({ ...item, subName: subLabel }));
                }
            }

            if (searchQuery.trim() !== '') {
                const q = searchQuery.toLowerCase();
                items = items.filter(item => {
                    const descText = getLocalizedText(item.desc).toLowerCase();
                    return item.name.toLowerCase().includes(q) ||
                           descText.includes(q) ||
                           (item.subName && item.subName.toLowerCase().includes(q));
                });
            }

            return items;
        }

        // จัดการเลือก / ยกเลิกเลือกไอเท็ม

            } else {
                selectedItemIds.add(id);
            }
            updateCardSelectionVisuals();
            updateToolbarButtons();

        function selectAll(val) {
            const visible = getCurrentlyDisplayedItems();
            if (val) {
                visible.forEach(it => selectedItemIds.add(it.id));
            } else {
                visible.forEach(it => selectedItemIds.delete(it.id));
            }
            updateCardSelectionVisuals();
            updateToolbarButtons();
        }

        function selectInstalled(val) {
            const visible = getCurrentlyDisplayedItems();
            visible.forEach(it => {
                if (it.installed) {
                    if (val) selectedItemIds.add(it.id);
                    else selectedItemIds.delete(it.id);
                }
            });
            updateCardSelectionVisuals();
            updateToolbarButtons();

            const visible = getCurrentlyDisplayedItems();
            visible.forEach(it => {

            const selectedVisible = visible.filter(it => selectedItemIds.has(it.id));

            const btnInstall = document.getElementById('btnInstallSelected');
            const btnUninstall = document.getElementById('btnUninstallSelected');
            const badgeCount = document.getElementById('installSelectedCountBadge');
            const btnClear = document.getElementById('btnClearSelection');

            if (btnInstall && btnUninstall) {
                if (count > 0) {
                    btnInstall.removeAttribute('disabled');
                    btnUninstall.removeAttribute('disabled');
                    if (badgeCount) {
                        badgeCount.textContent = count;
                        badgeCount.classList.remove('hidden');
                    }
                    if (btnClear) btnClear.classList.remove('hidden');
                } else {
                    btnInstall.setAttribute('disabled', 'true');

                    if (btnClear) btnClear.classList.add('hidden');

        // รันการติดตั้งหรือถอนการติดตั้งโปรแกรมที่เลือกเป็นกลุ่ม (Batch Run)
        function runBatchSelected(mode) {
            const visible = getCurrentlyDisplayedItems();
            const targetItems = visible.filter(it => selectedItemIds.has(it.id));
            if (targetItems.length === 0) {
                showToast(currentLang === 'th' ? 'กรุณาเลือกโปรแกรมที่ต้องการก่อน' : 'Please select items first');
                return;
            }

            const itemsPayload = targetItems.map(it => ({
                id: it.id,
                name: it.name,
                wingetId: it.wingetId || '',
                cmd: it.cmd || ''
            }));

            const batchTitle = mode === 'install'
                ? (currentLang === 'th' ? `กำลังติดตั้ง ${itemsPayload.length} รายการที่เลือก` : `Installing ${itemsPayload.length} selected items`)
                : (currentLang === 'th' ? `กำลังถอนการติดตั้ง ${itemsPayload.length} รายการที่เลือก` : `Uninstalling ${itemsPayload.length} selected items`);

            openInstallLogModal(batchTitle, `${mode.toUpperCase()} BATCH (${itemsPayload.length} items)`);

            if (window.chrome && window.chrome.webview) {
                window.chrome.webview.postMessage({
                    type: 'batch_run',
                    mode: mode,
                    items: itemsPayload
                });
            }
        }

        // แสดงรายการการ์ดโปรแกรม (แบบภาพที่ 1: Checkbox, Winhance Icon, Bold Title, Link, Installed Badge, ไม่มีปุ่มรันโปรแกรม)
        function renderPrograms() {
            const grid = document.getElementById('programGrid');
            const emptyState = document.getElementById('emptyState');
            const breadcrumbMain = document.getElementById('breadcrumbMain');
            const breadcrumbSub = document.getElementById('breadcrumbSub');
            const itemCount = document.getElementById('itemCount');
            const t = UI_STRINGS[currentLang];

            const currentMain = catalogData.find(c => c.id === activeMainId);
            if (!currentMain) return;

            breadcrumbMain.textContent = getLocalizedText(currentMain.name);

            const itemsToDisplay = getCurrentlyDisplayedItems();

            if (activeSubId === 'all') {
                breadcrumbSub.textContent = t.allSub;
            } else {
                const currentSub = currentMain.subCategories.find(s => s.id === activeSubId);
                breadcrumbSub.textContent = currentSub ? getLocalizedText(currentSub.name) : t.allSub;
            }

            itemCount.textContent = `${itemsToDisplay.length} ${t.itemsSuffix}`;

            if (itemsToDisplay.length === 0) {
                grid.innerHTML = '';
                emptyState.classList.remove('hidden');
                updateToolbarButtons();
                return;
            }

            emptyState.classList.add('hidden');
            grid.innerHTML = itemsToDisplay.map((item, idx) => {
                const isSelected = selectedItemIds.has(item.id);
                const iconUrl = item.iconUrl || (item.wingetId ? `https://cdn.jsdelivr.net/gh/memstechtips/package-icons@main/icons/external/${item.wingetId.toLowerCase()}.png` : '');

                                    alt="${item.name}"

                                    onerror="this.onerror=null; this.parentElement.innerHTML = SVG_ICONS.box;"

                        <!-- เนื้อหารายละเอียดโปรแกรม -->
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center justify-between gap-2">
                                <h3 class="card-title text-[14px] font-semibold leading-tight truncate">${item.name}</h3>
                                ${item.website ? `
                                    <button
                                        type="button"
                                        onclick="event.stopPropagation(); openExternalWebsite('${safeWebsite}');"
                                        class="card-ext-btn p-1 rounded-md transition-colors shrink-0 cursor-pointer"
                                        title="${item.website}"

                            <!-- สถานะการติดตั้ง (Installed Badge) สอดคล้องตามรูปที่ 1 -->

                                <div class="mt-2.5 inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-medium bg-emerald-500/15 dark:bg-[#23a55a]/15 text-emerald-600 dark:text-[#23a55a] border border-emerald-500/30 dark:border-[#23a55a]/30">
                                    <svg class="w-3 h-3 stroke-[2.5]" viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="20 6 9 17 4 12"></polyline></svg>

        // เปลี่ยนหมวดหมู่หลัก (ป้องกันการทำงานซ้ำหากกดหมวดหมู่เดิมที่เลือกอยู่แล้ว)
        function selectMainCategory(id) {
            if (activeMainId === id) return;
            activeMainId = id;
            activeSubId = 'all';
            renderAll();
        }

        // เปลี่ยนหมวดหมู่ย่อย (ป้องกันการทำงานซ้ำหากกดหมวดหมู่ย่อยเดิม)
        function selectSubCategory(id) {
            if (activeSubId === id) return;
            activeSubId = id;
            renderSubCategories();
            renderPrograms();
        }

        // จำลองการรันโปรแกรมและเปิดหน้าต่างอนิเมชั่น Log กำลังติดตั้ง
        function runAction(encodedName, encodedCmd, btnEl) {
            const name = decodeURIComponent(encodedName);
            const cmd = decodeURIComponent(encodedCmd);
            if (isInstalling) return;
            isInstalling = true;
            activeRunButton = btnEl;

            const t = UI_STRINGS[currentLang];

            if (btnEl) {
                btnEl.disabled = true;
                btnEl.classList.add('opacity-90');
                btnEl.innerHTML = `${SVG_ICONS.spinner}<span>${t.runningBtn}</span>`;
            }

            openInstallLogModal(name, cmd);
        }

        // เปิดหน้าต่าง Log แสดงขั้นตอนการติดตั้งแบบเรียลไทม์
        function openInstallLogModal(appName, cmd) {
            const t = UI_STRINGS[currentLang];
            const backdrop = document.getElementById('installLogBackdrop');
            const modal = document.getElementById('installLogModal');
            const statusIconBox = document.getElementById('logStatusIconBox');
            const spinnerIcon = document.getElementById('logSpinnerIcon');
            const doneIcon = document.getElementById('logDoneIcon');
            const logAppName = document.getElementById('logAppName');
            const logStatusBadge = document.getElementById('logStatusBadge');
            const logSubStatus = document.getElementById('logSubStatus');
            const logProgressBar = document.getElementById('logProgressBar');
            const logProgressPercent = document.getElementById('logProgressPercent');
            const logOutputBox = document.getElementById('logOutputBox');
            const logFooterHint = document.getElementById('logFooterHint');
            const logDoneBtn = document.getElementById('logDoneBtn');

            logTimers.forEach(timer => clearTimeout(timer));
            logTimers = [];

            logAppName.textContent = appName;
            logStatusBadge.textContent = t.logInstallingBadge;
            logStatusBadge.className = 'text-[10px] font-medium px-2 py-0.5 rounded-full theme-subbar border theme-border theme-text-primary shrink-0';
            logSubStatus.textContent = t.logInitSub;
            logProgressBar.style.width = '0%';
            logProgressBar.className = 'h-full rounded-full theme-btn-accent transition-all duration-300 ease-out';
            logProgressPercent.textContent = '0%';
            logOutputBox.innerHTML = '';
            logFooterHint.textContent = t.logFooterRunning;

            // ตั้งปุ่มด้านล่างเป็นโหมด "ยกเลิกการติดตั้ง"
            logDoneBtn.textContent = t.logCancelBtn;
            logDoneBtn.className = 'px-4 py-1.5 rounded-xl text-xs font-medium bg-red-500/10 text-red-600 dark:text-red-400 border border-red-500/20 hover:bg-red-500/20 transition-all active:scale-95';

            statusIconBox.className = 'w-9 h-9 rounded-xl theme-btn-accent flex items-center justify-center shrink-0 transition-colors duration-300';
            spinnerIcon.classList.remove('hidden');
            doneIcon.classList.add('hidden');

            backdrop.classList.remove('log-backdrop-hidden');
            backdrop.classList.add('log-backdrop-visible');
            requestAnimationFrame(() => {
                modal.classList.remove('log-modal-hidden');
                modal.classList.add('log-modal-visible');
            });

            if (window.chrome && window.chrome.webview) {
                // รันคำสั่งจริงบนระบบ Windows ผ่าน PowerShell
                window.chrome.webview.postMessage({
                    type: 'run',
                    appName: appName,
                    cmd: cmd
                });
            } else {
                // โหมดจำลองเมื่อเปิดทดสอบผ่านเว็บเบราว์เซอร์ปกติ
                const steps = [
                    { delay: 120, progress: 12, text: t.logSteps[0] },
                    { delay: 650, progress: 34, text: t.logSteps[1] },
                    { delay: 1300, progress: 62, text: t.logSteps[2] },
                    { delay: 2050, progress: 88, text: t.logSteps[3] },
                    { delay: 2700, progress: 100, text: t.logSteps[4], done: true }
                ];

                steps.forEach(step => {
                    const timer = setTimeout(() => {
                        if (!isInstalling) return;

                        logProgressBar.style.width = `${step.progress}%`;
                        logProgressPercent.textContent = `${step.progress}%`;
                        logSubStatus.textContent = step.text;
                        appendLogLine(step.text, step.done);

                        if (step.done) {
                            window.desktopBridge.setComplete(true, t.logDoneSub);
                        }
                    }, step.delay);
                    logTimers.push(timer);
                });
            }
        }

        // คืนค่าปุ่มบนการ์ดโปรแกรมกลับเป็นปกติ
        function resetActiveRunButton() {
            if (!activeRunButton) return;
            const t = UI_STRINGS[currentLang];
            activeRunButton.disabled = false;
            activeRunButton.classList.remove('opacity-90');
            activeRunButton.innerHTML = `${SVG_ICONS.play}<span>${t.runBtn}</span>`;
            activeRunButton = null;
        }

        // เพิ่มบรรทัดข้อความพร้อมเวลาลงในกล่อง Log
        function appendLogLine(message, isSuccess = false) {
            const logOutputBox = document.getElementById('logOutputBox');
            const now = new Date();
            const timeStr = now.toTimeString().split(' ')[0];

            const line = document.createElement('div');
            line.className = 'animate-log-line flex items-start gap-2';
            line.innerHTML = `
                <span class="theme-text-muted shrink-0">[${timeStr}]</span>
                <span class="${isSuccess ? 'text-emerald-500 font-medium' : 'theme-text-primary'}">${message}</span>
            `;
            logOutputBox.appendChild(line);
            logOutputBox.scrollTop = logOutputBox.scrollHeight;
        }

        // จัดการเมื่อกดปุ่ม "ยกเลิกการติดตั้ง" หรือปุ่มกากบาท (X) หรือปุ่ม "เสร็จสิ้น"
        function handleLogCloseOrCancel() {
            const wasInstalling = isInstalling;
            const appName = document.getElementById('logAppName').textContent;
            const t = UI_STRINGS[currentLang];

            // หยุดคิวติดตั้งทั้งหมดทันที ไม่ทำงานต่อในเบื้องหลัง
            isInstalling = false;
            logTimers.forEach(timer => clearTimeout(timer));
            logTimers = [];

            // คืนค่าปุ่มบนการ์ดโปรแกรมกลับเป็น "รันโปรแกรม"
            resetActiveRunButton();

            // ปิดหน้าต่าง Log Modal
            const backdrop = document.getElementById('installLogBackdrop');
            const modal = document.getElementById('installLogModal');

            modal.classList.remove('log-modal-visible');
            modal.classList.add('log-modal-hidden');
            backdrop.classList.remove('log-backdrop-visible');
            backdrop.classList.add('log-backdrop-hidden');

            if (wasInstalling) {
                if (window.chrome && window.chrome.webview) {
                    window.chrome.webview.postMessage({ type: 'cancel' });
                }
                showToast(`${t.toastCancelled} ${appName}`);
            }
        }

        // แสดงแถบแจ้งเตือนด้านล่าง
        let toastTimeout;
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            toastMessage.textContent = message;

            toast.classList.remove('opacity-0', 'translate-y-2');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
            }, 2200);
        }

        // ค้นหาแบบเรียลไทม์ + ระบบเดาคำค้นหาอัตโนมัติ (Search Autocomplete)
        const searchInputEl = document.getElementById('searchInput');

        function getAllCatalogItems() {
            const allItems = [];
            catalogData.forEach(cat => {
                const catName = getLocalizedText(cat.name);
                cat.subCategories.forEach(sub => {
                    const subName = getLocalizedText(sub.name);
                    sub.items.forEach(item => {
                        allItems.push({
                            ...item,
                            mainId: cat.id,
                            mainName: catName,
                            subId: sub.id,
                            subName: subName
                        });
                    });
                });
            });
            return allItems;
        }

        function highlightMatchedText(text, query) {
            if (!query) return text;
            const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp(`(${escaped})`, 'gi');
            return text.replace(regex, '<mark class="bg-slate-900/10 dark:bg-white/15 theme-text-primary font-semibold rounded px-0.5">$1</mark>');
        }

        function updateSearchSuggestions(query) {
            const dropdown = document.getElementById('searchSuggestionsDropdown');
            const listEl = document.getElementById('searchSuggestionsList');
            const clearBtn = document.getElementById('clearSearchBtn');
            const t = UI_STRINGS[currentLang];

            if (query.trim().length > 0) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }

            const allItems = getAllCatalogItems();
            const q = query.trim().toLowerCase();

            if (q === '') {
                currentSuggestions = allItems.slice(0, 5);
            } else {
                const startsWithMatches = [];
                const containsMatches = [];

                allItems.forEach(item => {
                    const nameLower = item.name.toLowerCase();
                    const descLower = getLocalizedText(item.desc).toLowerCase();
                    const subLower = item.subName.toLowerCase();

                    if (nameLower.startsWith(q)) {
                        startsWithMatches.push(item);
                    } else if (nameLower.includes(q) || descLower.includes(q) || subLower.includes(q)) {
                        containsMatches.push(item);
                    }
                });

                currentSuggestions = [...startsWithMatches, ...containsMatches].slice(0, 6);
            }

            selectedSuggestionIndex = -1;

            if (currentSuggestions.length === 0) {
                listEl.innerHTML = `<div class="px-3 py-3 text-center text-[11px] theme-text-muted">${t.suggestionNoMatch}</div>`;
            } else {
                listEl.innerHTML = currentSuggestions.map((item, idx) => {
                    const highlightedName = highlightMatchedText(item.name, query.trim());
                    return `
                        <button
                            type="button"
                            data-suggestion-idx="${idx}"
                            onclick="selectSearchSuggestion(${idx})"
                            class="suggestion-item w-full px-3 py-2 text-left flex items-center justify-between gap-2 theme-hover transition-colors"
                        >
                            <div class="flex items-center gap-2 min-w-0">
                                <span class="theme-text-muted shrink-0">${SVG_ICONS.box}</span>
                                <span class="text-xs theme-text-primary truncate">${highlightedName}</span>
                            </div>
                            <span class="text-[10px] theme-text-muted shrink-0 truncate max-w-[90px]">${item.subName}</span>
                        </button>
                    `;
                }).join('');
            }

            showSearchSuggestions();
        }

        function showSearchSuggestions() {
            const dropdown = document.getElementById('searchSuggestionsDropdown');
            if (!dropdown) return;
            dropdown.classList.remove('hidden');
            requestAnimationFrame(() => {
                dropdown.classList.remove('opacity-0', '-translate-y-1.5', 'scale-[0.98]', 'pointer-events-none');
            });
        }

        function hideSearchSuggestions() {
            const dropdown = document.getElementById('searchSuggestionsDropdown');
            if (!dropdown || dropdown.classList.contains('hidden')) return;
            dropdown.classList.add('opacity-0', '-translate-y-1.5', 'scale-[0.98]', 'pointer-events-none');
            setTimeout(() => {
                dropdown.classList.add('hidden');
            }, 180);
        }

        function selectSearchSuggestion(idx) {
            const selected = currentSuggestions[idx];
            if (!selected) return;

            searchInputEl.value = selected.name;
            searchQuery = selected.name;
            document.getElementById('clearSearchBtn').classList.remove('hidden');

            if (activeMainId !== selected.mainId) {
                activeMainId = selected.mainId;
            }
            activeSubId = 'all';

            hideSearchSuggestions();
            renderAll();
        }

        function clearSearch() {
            searchInputEl.value = '';
            searchQuery = '';
            document.getElementById('clearSearchBtn').classList.add('hidden');
            updateSearchSuggestions('');
            renderPrograms();
            searchInputEl.focus();
        }

        function highlightActiveSuggestionItem() {
            const items = document.querySelectorAll('.suggestion-item');
            items.forEach((el, idx) => {
                if (idx === selectedSuggestionIndex) {
                    el.style.backgroundColor = 'var(--bg-hover)';
                    el.scrollIntoView({ block: 'nearest' });
                } else {
                    el.style.backgroundColor = '';
                }
            });
        }

        searchInputEl.addEventListener('focus', () => {
            updateSearchSuggestions(searchInputEl.value);
        });

        searchInputEl.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            updateSearchSuggestions(searchQuery);
            renderPrograms();
        });

        searchInputEl.addEventListener('keydown', (e) => {
            const dropdown = document.getElementById('searchSuggestionsDropdown');
            const isOpen = dropdown && !dropdown.classList.contains('hidden');

            if (e.key === 'ArrowDown' && isOpen && currentSuggestions.length > 0) {
                e.preventDefault();
                selectedSuggestionIndex = (selectedSuggestionIndex + 1) % currentSuggestions.length;
                highlightActiveSuggestionItem();
            } else if (e.key === 'ArrowUp' && isOpen && currentSuggestions.length > 0) {
                e.preventDefault();
                selectedSuggestionIndex = (selectedSuggestionIndex - 1 + currentSuggestions.length) % currentSuggestions.length;
                highlightActiveSuggestionItem();
            } else if (e.key === 'Enter' && isOpen && selectedSuggestionIndex >= 0) {
                e.preventDefault();
                selectSearchSuggestion(selectedSuggestionIndex);
            } else if (e.key === 'Escape') {
                hideSearchSuggestions();
            }
        });

        function renderAll() {
            renderMainCategories();
            renderSubCategories();
            renderPrograms();
        }

        // ปรับตำแหน่งเส้นใต้หมวดหมู่เมื่อขยาย/ย่อหน้าจอ
        window.addEventListener('resize', () => {
            updateMainTabIndicator();
            initMatrixGrid();
        });

        // ==========================================
        // Minimalist Falling Characters (Matrix Rain)
        // แสดงครอบคลุมทั้งกรอบหน้าต่างแอปตั้งแต่ส่วนหัวด้านบนสุด
        // ==========================================
        const matrixCanvas = document.getElementById('matrixCanvas');
        let matrixCtx = null;
        let matrixAnimId = null;

        const GLYPHS = (
            "ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ" +
            "ABCDEFGHIKLMNOPRSTUVWXYZ" +
            "ЯƎИƧꓘꓷ∀" +
            "012345789" +
            "=+:.*⊥⊤-"
        ).split("");

        const matrixConfig = {
            theme: 'light',
            speed: 0.85,
            maxAlpha: 0.48,
            fontSize: 13,
            fontWeight: 400,
            mouseClear: true
        };

        const matrixThemes = {
            light: {
                bg: '#fbfbfb',
                headRgb: [71, 85, 105],
                tailRgb: [148, 163, 184]
            },
            dark: {
                bg: '#09090b',
                headRgb: [228, 228, 231],
                tailRgb: [82, 82, 91]
            }
        };

        let mWidth = 0, mHeight = 0, mDpr = 1, mCols = 0, mRows = 0;
        let mColSpacing = 20, mRowSpacing = 19;
        let mColumns = [];
        const mMouse = { x: -9999, y: -9999, smoothX: -9999, smoothY: -9999, active: false };

        function mRandomGlyph() {
            return GLYPHS[(Math.random() * GLYPHS.length) | 0];
        }

        function mCreateStream(initialRandomY = true) {
            const length = 8 + Math.random() * 18;
            return {
                y: initialRandomY ? (Math.random() * (mRows + length * 2)) - length : -Math.random() * 15,
                speed: (0.045 + Math.random() * 0.065),
                length: length,
                intensity: 0.65 + Math.random() * 0.35
            };
        }

        function initMatrixGrid() {
            const appWin = document.getElementById('appWindow');
            if (!matrixCanvas || !appWin) return;
            const rect = appWin.getBoundingClientRect();
            if (rect.width === 0 || rect.height === 0) return;

            matrixCtx = matrixCanvas.getContext('2d', { alpha: false });
            mDpr = Math.min(window.devicePixelRatio || 1, 2);

            mWidth = rect.width;
            mHeight = rect.height;

            matrixCanvas.width = mWidth * mDpr;
            matrixCanvas.height = mHeight * mDpr;
            matrixCtx.setTransform(mDpr, 0, 0, mDpr, 0, 0);

            mColSpacing = Math.round(matrixConfig.fontSize * 1.55);
            mRowSpacing = Math.round(matrixConfig.fontSize * 1.45);

            mCols = Math.ceil(mWidth / mColSpacing) + 1;
            mRows = Math.ceil(mHeight / mRowSpacing) + 2;

            mColumns = [];
            for (let c = 0; c < mCols; c++) {
                const columnActivity = Math.random();
                const cellChars = [];
                const cellMirrored = [];
                const cellMutateRate = [];

                for (let r = 0; r < mRows; r++) {
                    cellChars.push(mRandomGlyph());
                    cellMirrored.push(Math.random() < 0.16);
                    cellMutateRate.push(0.001 + Math.random() * 0.004);
                }

                const streams = [];
                const streamCount = columnActivity > 0.6 ? 2 : 1;
                for (let s = 0; s < streamCount; s++) {
                    const st = mCreateStream(true);
                    if (s === 1) st.y -= mRows * 0.6;
                    streams.push(st);
                }

                mColumns.push({
                    x: c * mColSpacing + mColSpacing * 0.5,
                    chars: cellChars,
                    mirrored: cellMirrored,
                    mutateRate: cellMutateRate,
                    streams: streams,
                    densityScale: columnActivity < 0.12 ? 0.45 : 1.0
                });
            }
        }

        function getMatrixVisibilityMask(x, y) {
            let mask = 1.0;

            if (matrixConfig.mouseClear && mMouse.active) {
                const mdx = x - mMouse.smoothX;
                const mdy = y - mMouse.smoothY;
                const mRadius = Math.min(mWidth, mHeight) * 0.22;
                const mDistSq = mdx * mdx + mdy * mdy;
                const mRadSq = mRadius * mRadius;

                if (mDistSq < mRadSq) {
                    const mt = Math.sqrt(mDistSq / mRadSq);
                    const mSmooth = mt * mt * (3 - 2 * mt);
                    mask *= (0.15 + 0.85 * mSmooth);
                }
            }
            return mask;
        }

        let mLastMatrixTime = performance.now();
        function animateMatrix(now) {
            const dt = Math.min((now - mLastMatrixTime) / 16.6667, 3.0);
            mLastMatrixTime = now;

            if (matrixCtx && mWidth > 0 && mHeight > 0) {
                if (mMouse.active) {
                    mMouse.smoothX += (mMouse.x - mMouse.smoothX) * 0.12 * dt;
                    mMouse.smoothY += (mMouse.y - mMouse.smoothY) * 0.12 * dt;
                }

                const theme = matrixThemes[matrixConfig.theme] || matrixThemes.light;

                matrixCtx.fillStyle = theme.bg;
                matrixCtx.fillRect(0, 0, mWidth, mHeight);

                matrixCtx.font = `${matrixConfig.fontWeight} ${matrixConfig.fontSize}px "JetBrains Mono", "Noto Sans JP", monospace`;
                matrixCtx.textAlign = 'center';
                matrixCtx.textBaseline = 'middle';

                const headR = theme.headRgb[0], headG = theme.headRgb[1], headB = theme.headRgb[2];
                const tailR = theme.tailRgb[0], tailG = theme.tailRgb[1], tailB = theme.tailRgb[2];

                for (let c = 0; c < mCols; c++) {
                    const col = mColumns[c];
                    const x = col.x;

                    for (let s = 0; s < col.streams.length; s++) {
                        const stream = col.streams[s];
                        stream.y += stream.speed * matrixConfig.speed * dt;

                        if (stream.y - stream.length > mRows + 2) {
                            stream.y = -Math.random() * 12;
                            stream.length = 8 + Math.random() * 18;
                            stream.speed = 0.045 + Math.random() * 0.065;
                        }
                    }

                    for (let r = 0; r < mRows; r++) {
                        let cellAlpha = 0;
                        let isHeadFactor = 0;

                        for (let s = 0; s < col.streams.length; s++) {
                            const stream = col.streams[s];
                            const dist = stream.y - r;

                            if (dist >= -1.2 && dist < 0) {
                                const fadeIn = (dist + 1.2) / 1.2;
                                const smoothIn = fadeIn * fadeIn * (3 - 2 * fadeIn);
                                const a = smoothIn * stream.intensity;
                                if (a > cellAlpha) {
                                    cellAlpha = a;
                                    isHeadFactor = smoothIn;
                                }
                            } else if (dist >= 0 && dist <= stream.length) {
                                const norm = 1.0 - (dist / stream.length);
                                const smoothTail = Math.pow(norm, 1.45);
                                const a = smoothTail * stream.intensity;
                                if (a > cellAlpha) {
                                    cellAlpha = a;
                                    isHeadFactor = dist < 1.5 ? (1.0 - dist / 1.5) : 0;
                                }
                            }
                        }

                        if (cellAlpha <= 0.015) continue;

                        const y = r * mRowSpacing + mRowSpacing * 0.5;
                        const mask = getMatrixVisibilityMask(x, y);
                        const finalAlpha = cellAlpha * matrixConfig.maxAlpha * col.densityScale * mask;

                        if (finalAlpha <= 0.015) continue;

                        if (Math.random() < col.mutateRate[r] * (1 + isHeadFactor * 5) * dt) {
                            col.chars[r] = mRandomGlyph();
                        }

                        const cr = (tailR + (headR - tailR) * isHeadFactor) | 0;
                        const cg = (tailG + (headG - tailG) * isHeadFactor) | 0;
                        const cb = (tailB + (headB - tailB) * isHeadFactor) | 0;

                        matrixCtx.fillStyle = `rgba(${cr},${cg},${cb},${finalAlpha.toFixed(3)})`;

                        if (col.mirrored[r]) {
                            matrixCtx.save();
                            matrixCtx.translate(x, y);
                            matrixCtx.scale(-1, 1);
                            matrixCtx.fillText(col.chars[r], 0, 0);
                            matrixCtx.restore();
                        } else {
                            matrixCtx.fillText(col.chars[r], x, y);
                        }
                    }
                }
            }

            matrixAnimId = requestAnimationFrame(animateMatrix);
        }

        function startMatrixAnimation() {
            if (matrixAnimId) cancelAnimationFrame(matrixAnimId);
            initMatrixGrid();
            mLastMatrixTime = performance.now();
            matrixAnimId = requestAnimationFrame(animateMatrix);
        }

        const appWindowEl = document.getElementById('appWindow');
        if (appWindowEl) {
            appWindowEl.addEventListener('mousemove', (e) => {
                const rect = appWindowEl.getBoundingClientRect();
                const relX = e.clientX - rect.left;
                const relY = e.clientY - rect.top;
                if (!mMouse.active) {
                    mMouse.smoothX = relX;
                    mMouse.smoothY = relY;
                    mMouse.active = true;
                }
                mMouse.x = relX;
                mMouse.y = relY;
            });

            appWindowEl.addEventListener('mouseleave', () => {
                mMouse.active = false;
            });
        }

        // นำเข้าข้อมูลซอฟต์แวร์ที่ติดตั้งในเครื่องจาก PowerShell C# Registry Scanner
        function setInstalledRegistry(jsonStr) {
            try {
                let list = typeof jsonStr === 'string' ? JSON.parse(jsonStr) : jsonStr;
                if (!Array.isArray(list)) return;
                const lowerList = list.map(s => String(s).toLowerCase());

                catalogData.forEach(cat => {
                    cat.subCategories.forEach(sub => {
                        sub.items.forEach(item => {
                            const name = (item.name || '').toLowerCase();
                            const winget = (item.wingetId || '').toLowerCase();
                            const reg = (item.regPattern || name).toLowerCase();

                            let matched = false;
                            for (let i = 0; i < lowerList.length; i++) {
                                const entry = lowerList[i];
                                if (entry.includes(reg) || (winget && entry.includes(winget.split('.').pop()))) {
                                    matched = true;
                                    break;
                                }
                            }
                            item.installed = matched;
                        });
                    });
                });

                renderPrograms();
                updateToolbarButtons();
            } catch (e) {
                console.error('Error applying installed registry:', e);
            }
        }
        window.setInstalledRegistry = setInstalledRegistry;

        function setInstalledRegistryBase64(b64) {
            try {
                const bin = atob(b64);
                const bytes = new Uint8Array(bin.length);
                for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                const text = new TextDecoder().decode(bytes);
                setInstalledRegistry(JSON.parse(text));
            } catch(e) {
                console.error('Error decoding installed apps base64:', e);
            }
        }
        window.setInstalledRegistryBase64 = setInstalledRegistryBase64;

        // เริ่มต้นทำงาน
        window.addEventListener('DOMContentLoaded', () => {
            renderAll();
            startMatrixAnimation();
            syncFromGitHub();
        });

        // Desktop Bridge สำหรับรับคำสั่งและ Log สตรีมสดจาก PowerShell
        window.desktopBridge = {
            setStatus: function(status) {
                if (status === 'completed') {
                    this.setComplete(true, (UI_STRINGS[currentLang] && UI_STRINGS[currentLang].logDoneSub) || 'เสร็จสิ้นเรียบร้อย');
                } else {
                    this.setComplete(false, 'การติดตั้งหรือรันคำสั่งล้มเหลว');
                }
            },
            appendLog: function(message, isSuccess) {
                appendLogLine(message, isSuccess);
            },
            setProgress: function(percent, statusText) {
                const logProgressBar = document.getElementById('logProgressBar');
                const logProgressPercent = document.getElementById('logProgressPercent');
                const logSubStatus = document.getElementById('logSubStatus');
                if (logProgressBar) logProgressBar.style.width = percent + '%';
                if (logProgressPercent) logProgressPercent.textContent = percent + '%';
                if (logSubStatus && statusText) logSubStatus.textContent = statusText;
            },
            setComplete: function(success, message) {
                isInstalling = false;
                const spinnerIcon = document.getElementById('logSpinnerIcon');
                const doneIcon = document.getElementById('logDoneIcon');
                const statusIconBox = document.getElementById('logStatusIconBox');
                const logProgressBar = document.getElementById('logProgressBar');
                const logProgressPercent = document.getElementById('logProgressPercent');
                const logStatusBadge = document.getElementById('logStatusBadge');
                const logSubStatus = document.getElementById('logSubStatus');
                const logFooterHint = document.getElementById('logFooterHint');
                const logDoneBtn = document.getElementById('logDoneBtn');
                const t = UI_STRINGS[currentLang];

                if (spinnerIcon) spinnerIcon.classList.add('hidden');
                if (doneIcon) doneIcon.classList.remove('hidden');

                if (success) {
                    if (statusIconBox) statusIconBox.className = 'w-9 h-9 rounded-xl bg-emerald-500/15 text-emerald-500 flex items-center justify-center shrink-0 transition-colors duration-300';
                    if (logProgressBar) {
                        logProgressBar.style.width = '100%';
                        logProgressBar.className = 'h-full rounded-full bg-emerald-500 transition-all duration-300 ease-out';
                    }
                    if (logProgressPercent) logProgressPercent.textContent = '100%';
                    if (logStatusBadge) {
                        logStatusBadge.textContent = t.logCompletedBadge;
                        logStatusBadge.className = 'text-[10px] font-medium px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-500 shrink-0';
                    }
                    if (logSubStatus) logSubStatus.textContent = message || t.logDoneSub;
                    if (logFooterHint) logFooterHint.textContent = t.logFooterDone;
                } else {
                    if (statusIconBox) statusIconBox.className = 'w-9 h-9 rounded-xl bg-red-500/15 text-red-500 flex items-center justify-center shrink-0 transition-colors duration-300';
                    if (logProgressBar) {
                        logProgressBar.style.width = '100%';
                        logProgressBar.className = 'h-full rounded-full bg-red-500 transition-all duration-300 ease-out';
                    }
                    if (logProgressPercent) logProgressPercent.textContent = '100%';
                    if (logStatusBadge) {
                        logStatusBadge.textContent = 'ล้มเหลว';
                        logStatusBadge.className = 'text-[10px] font-medium px-2 py-0.5 rounded-full bg-red-500/15 text-red-500 shrink-0';
                    }
                    if (logSubStatus) logSubStatus.textContent = message || 'การติดตั้งล้มเหลว';
                    if (logFooterHint) logFooterHint.textContent = 'พบข้อผิดพลาด';
                }

                if (logDoneBtn) {
                    logDoneBtn.textContent = t.logDoneBtn;
                    logDoneBtn.className = 'px-4 py-1.5 rounded-xl text-xs font-medium theme-btn-accent shadow-sm transition-all active:scale-95';
                }
                resetActiveRunButton();
            }
        };

        // ผูกการลากหน้าต่าง (Drag Window) บริเวณแถบบนสุด (Red box header) เลื่อนตำแหน่งโปรแกรมได้อย่างราบรื่น
        document.addEventListener('DOMContentLoaded', () => {
            const titleBar = document.getElementById('appTitleBar') || document.querySelector('.app-header > div:first-child');
            if (titleBar) {
                titleBar.addEventListener('mousedown', (e) => {
                    if (e.button !== 0) return;
                    // หากคลิกที่ปุ่ม, ช่องค้นหา, หรือดรอปดาวน์ ให้ทำงานตามปกติ ไม่เริ่มลาก
                    if (e.target.closest('button, input, select, textarea, a, #searchContainer, #langDropdownWrapper, [role="button"]')) {
                        return;
                    }
                    if (window.chrome && window.chrome.webview) {
                        window.chrome.webview.postMessage({ type: 'drag' });
                    }
                });

                titleBar.addEventListener('dblclick', (e) => {
                    if (e.target.closest('button, input, select, textarea, a, #searchContainer, #langDropdownWrapper, [role="button"]')) {
                        return;
                    }
                    toggleMaximizeApp();
                });
            }
        });

    </script>
